aid: ampaworks
name: AMPAworks
description: >-
  AMPAworks builds AI-powered smart-shelf inventory management for healthcare
  and defense supply chains. Its platform pairs computer-vision cameras and
  rolling kiosks that image inventory to auto-count stock in real time with
  software that tracks supplies 24/7, automates reordering, and gives teams
  live visibility to prevent stock-outs. The company reports outcomes such as
  $15M in cost reduction, 25,000 hours saved on hand counting, and 72% fewer
  stock-outs across more than 28 healthcare and operational organizations.
  Backed by 500 Global, AMPAworks operates from offices in Santa Monica CA,
  Buffalo NY, Hackensack NJ, and Ann Arbor MI.
